name: AI Scan public Pages kit integrity smoke (NO RELEASE)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-published-kit.yml'
      - 'index.html'
      - 'app.js'
      - 'sw.js'
      - 'zip-store.js'
      - 'styles.css'
      - 'ui-extras.js'
      - 'update-status.js'
      - 'manifest.webmanifest'
      - 'kit-assets/**'
      - 'icons/**'
      - 'assets/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin trusted public verifier
        uses: actions/checkout@v4
        with:
          ref: 7fc1ba49126a8e2e552ce7c9f58f062e388da456
          path: trusted_tools
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check HTML, JS, all 16 kit assets and HOLD on actual public HTTP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-evidence
          python trusted_tools/scripts/verify_pages_live.py \
            --site . \
            --url https://meka-create.github.io/pokesleep-ai-scan/ \
            --commit "$GITHUB_SHA" --attempts 8 --delay 20 \
            --out public-evidence/PAGES_DEPLOYMENT_HEALTH.json
          python - <<'PY'
          import json
          j=json.load(open('public-evidence/PAGES_DEPLOYMENT_HEALTH.json'))
          assert j['result']=='ALL_EXPECTED_ASSETS_LIVE',j['result']
          assert j['productionCsvAllowed'] is False
          print('ALL_PUBLIC_22_ASSETS_MATCH_EXPECTED_BYTES AND CSV_HOLD')
          PY
      - name: Check omitted static assets over public HTTPS (10 paths)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, pathlib, time, urllib.request
          root=pathlib.Path('.')
          missing=['update-status.js','manifest.webmanifest','assets/example-screenshot.png',
                   'assets/ogp-card.png','icons/apple-touch-icon.png','icons/favicon-32.png',
                   'icons/icon-192.png','icons/icon-512-maskable.png','icons/icon-512.png',
                   'icons/icon-maskable-192.png']
          # This separate group excludes status JSON (dynamic and not part of the ZIP).
          assert len(missing)==10 and len(set(missing))==10
          base='https://meka-create.github.io/pokesleep-ai-scan/'
          for name in missing:
              local=(root/name).read_bytes()
              url=base+name+'?integrity='+str(time.time_ns())
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,timeout=18) as response:
                  assert response.status==200,(name,response.status)
                  remote=response.read()
              assert hashlib.sha256(remote).digest()==hashlib.sha256(local).digest(),name
          print('ALL_ADDITIONAL_10_PUBLIC_ASSETS_MATCH_EXPECTED_BYTES')
          PY
      - name: Save public HTTP validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_Scan_Public_Kit_22_Assets_ReadOnly_Evidence
          path: public-evidence/
          retention-days: 30
          if-no-files-found: warn

name: AI Scan legacy upstream candidate audit (READ ONLY, v24+ release protected)
on:
  workflow_dispatch:
  schedule:
    # 04:30 Japan time, after read-only status watcher at 04:00.
    - cron: '30 19 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verified-master-autopromotion.yml'
concurrency:
  group: ai-scan-readonly-upstream-status
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin trusted promotion implementation at independently reviewed SHA
        uses: actions/checkout@v4
        with:
          ref: 7fc1ba49126a8e2e552ce7c9f58f062e388da456
          path: trusted_tools
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real browser probe
        run: |
          python -m pip install playwright==1.56.0 pyyaml==6.0.3 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Clone upstream read-only at exactly one commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/nitoyon/pokesleep-tool.git "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" rev-parse HEAD
      - name: Select public kit layout
        shell: bash
        run: |
          set -euo pipefail
          if test -f kit-assets/MASTER_DATA.json; then
            echo 'KIT_DIR=kit-assets' >> "$GITHUB_ENV"
          elif test -f site/kit-assets/MASTER_DATA.json; then
            echo 'KIT_DIR=site/kit-assets' >> "$GITHUB_ENV"
          else
            echo 'No active master' >&2; exit 2
          fi
      - name: Verify frozen CSV contract matches trusted audit implementation
        run: |
          set -euo pipefail
          cmp kit-assets/CSV_SCHEMA.json trusted_tools/kit-assets/CSV_SCHEMA.json
          cmp kit-assets/VALIDATOR.py trusted_tools/kit-assets/VALIDATOR.py
      - name: Trusted local unit regression and syntax
        run: |
          python -m py_compile trusted_tools/scripts/daily_watch.py trusted_tools/scripts/sync_upstream.py trusted_tools/scripts/import_compat_gate.py trusted_tools/scripts/publish_watch_status.py trusted_tools/scripts/build_auto_vectors.py trusted_tools/scripts/run_pinned_import_e2e.py trusted_tools/scripts/verified_auto_promotion.py trusted_tools/scripts/publish_auto_result.py
          python -m unittest discover -s trusted_tools/tests -p 'test_auto_watch.py' -v
          python -m unittest discover -s trusted_tools/tests -p 'test_upstream_sync.py' -v
          python -m unittest discover -s trusted_tools/tests -p 'test_import_compat_gate.py' -v
          python -m unittest discover -s trusted_tools/tests -p 'test_verified_auto_promotion.py' -v
      - name: Detect changes; stage candidate, never write active master
        id: detect
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python trusted_tools/scripts/daily_watch.py --upstream "$RUNNER_TEMP/upstream" --kit-dir "$KIT_DIR" --out upstream_staging
          if test -f upstream_staging/UPSTREAM_DIFF.json; then
            python - <<'PY'
          import json
          d=json.load(open('upstream_staging/UPSTREAM_DIFF.json'))
          fields=('addedSpecies','removedSpecies','changedSpecies','newIngredientKeys','removedIngredientKeys','changedIngredientTranslations','newSubskillKeys','removedSubskillKeys','changedSubskillTranslations','newNatureKeys','removedNatureKeys','changedNatureTranslations')
          import os
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('changed='+('true' if any(d.get(x) for x in fields) else 'false')+'\n')
          PY
          fi
      - name: Generate candidate-bound REAL importer test vectors
        if: steps.detect.outcome == 'success' && steps.detect.outputs.changed == 'true'
        id: vectors
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python trusted_tools/scripts/build_auto_vectors.py \
            --master upstream_staging/MASTER_DATA.candidate.json \
            --diff upstream_staging/UPSTREAM_DIFF.json \
            --csv upstream_staging/AUTO_VECTORS.csv \
            --coverage upstream_staging/VECTOR_COVERAGE.json
      - name: REAL CSV import and export using pinned locally built upstream UI
        id: e2e
        if: steps.vectors.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python trusted_tools/scripts/run_pinned_import_e2e.py \
            --upstream "$RUNNER_TEMP/upstream" \
            --candidate upstream_staging/MASTER_DATA.candidate.json \
            --diff upstream_staging/UPSTREAM_DIFF.json \
            --schema "$KIT_DIR/CSV_SCHEMA.json" \
            --validator "$KIT_DIR/VALIDATOR.py" \
            --preflight upstream_staging/preflight/UPSTREAM_PREFLIGHT.json \
            --vector upstream_staging/AUTO_VECTORS.csv \
            --coverage upstream_staging/VECTOR_COVERAGE.json \
            --out upstream_staging/e2e \
            --run-id "${{ github.run_id }}" \
            --base-sha "${{ github.sha }}"
      - name: Package strictly same-run promotion evidence
        if: steps.e2e.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p promotion_input/upstream_source/src/data promotion_input/upstream_source/src/i18n/ja promotion_input/upstream_source/src/util
          cp upstream_staging/MASTER_DATA.candidate.json promotion_input/
          cp upstream_staging/UPSTREAM_DIFF.json promotion_input/
          cp upstream_staging/AUTO_VECTORS.csv promotion_input/
          cp upstream_staging/VECTOR_COVERAGE.json promotion_input/
          cp upstream_staging/preflight/UPSTREAM_PREFLIGHT.json promotion_input/
          cp upstream_staging/e2e/PROMOTION_PROOF.json promotion_input/
          cp upstream_staging/e2e/browser/PROBE_RESULT.json promotion_input/
          cp upstream_staging/e2e/browser/roundtrip_export.csv promotion_input/
          cp upstream_staging/e2e/live/PROBE_RESULT.json promotion_input/LIVE_PROBE_RESULT.json
          cp upstream_staging/e2e/live/roundtrip_export.csv promotion_input/live_roundtrip_export.csv
          cp "$RUNNER_TEMP/upstream/src/data/pokemon.json" promotion_input/upstream_source/src/data/
          cp "$RUNNER_TEMP/upstream/src/i18n/ja/"{pokemons,data,skills}.json promotion_input/upstream_source/src/i18n/ja/
          cp "$RUNNER_TEMP/upstream/src/util/SubSkill.ts" promotion_input/upstream_source/src/util/
      - name: Preserve audit and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-auto-audit-evidence-HOLD
          path: upstream_staging/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload public-safe status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-auto-public-status
          path: upstream_staging/update-status.json
          retention-days: 2
          if-no-files-found: warn
      - name: Upload promotion proof only after real browser success
        if: steps.e2e.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-promotion-bundle-HOLD
          path: promotion_input/
          retention-days: 2
          if-no-files-found: error
      - name: Final audit gate — never mask failed detection or browser E2E
        if: always() && (steps.detect.outcome == 'failure' || steps.vectors.outcome == 'failure' || steps.e2e.outcome == 'failure')
        shell: bash
        run: |
          echo '::error title=Upstream verification failed::A required upstream or CSV round-trip check failed; no master can be promoted. See audit evidence artifact.'
          exit 1
  # The v24+ public app is pinned to release-kit-assets, NOT kit-assets.
  # Historic trusted promotion would rewrite app.js, index.html and sw.js with
  # prototype pins and silently roll back production ZIPs. The scheduled audit
  # above remains read-only; publishing this legacy patch is DISABLED.
  # The separate upstream status watcher remains scheduled. New species need a
  # fresh reviewed release-kit build, importer proof, and explicit release gate.
  # Do not re-enable this job without a new dual-kit publication architecture.

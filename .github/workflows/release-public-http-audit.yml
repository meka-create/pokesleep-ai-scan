name: AI Scan current production release public HTTP strict audit
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'sw.js'
      - 'release-kit-assets/**'
      - '.github/workflows/release-public-http-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-release-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check actual Pages against each expected shipped asset
        run: python qa/release_verify_published.py
      - name: Preserve public release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_Scan_Current_Public_Release_SHA256_Audit
          path: qa/RELEASE_PUBLIC_HTTP_AUDIT.json
          retention-days: 30
          if-no-files-found: warn

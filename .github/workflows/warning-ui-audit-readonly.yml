name: Warning icon and modal actual Chromium regression (READ ONLY)
on:
  push:
    branches: [warning-icon-ui-audit-20261011]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Static JavaScript syntax
        run: |
          node --check update-status.js
          node --check sw.js
      - name: Test warning-only icon, modal X, ESC and healthy state in real Chromium
        run: python qa/warning_ui_real_browser.py
      - name: Save read-only UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Warning_UI_Real_Browser_Evidence
          path: qa/warning_ui_browser_evidence.json
          retention-days: 30
          if-no-files-found: warn

name: Chat v25 four independently reproduced release regressions (NO DEPLOY)
on:
  push:
    branches: [chat-v25-independent-four-fixes-20261011]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  predeployment-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 7fc1ba49126a8e2e552ce7c9f58f062e388da456
          path: trusted_tools
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent full unit suite + dev/release pins + 4 regression fixes
        run: |
          set -euo pipefail
          python qa/onepass_contract.py
          python -m py_compile kit-assets/*.py release-kit-assets/*.py qa/*.py
          node --check app.js
          node --check zip-store.js
          node --check sw.js
          python -m unittest discover -s qa -p 'test_*.py' -v
          python -m unittest discover -s trusted_tools/tests -p 'test_auto_watch.py' -v
          python -m unittest discover -s trusted_tools/tests -p 'test_upstream_sync.py' -v
          python -m unittest discover -s trusted_tools/tests -p 'test_import_compat_gate.py' -v
          python -m unittest discover -s trusted_tools/tests -p 'test_verified_auto_promotion.py' -v
      - name: "Full release gate: valid CSV + no-approval + tampered-proof rejections"
        run: python qa/release_candidate_gate_smoke.py
      - name: Chromium setup
        run: |
          python -m pip install playwright==1.56.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Actual local-HTTP Chromium 10/30/100/172 ZIPs and all hashes
        run: python qa/release_browser_e2e.py
      - name: Store audit proof without publishing production
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chat_v25_Four_Fix_RealBrowser_Regression_Evidence
          path: qa/RELEASE_BROWSER_RESULTS.json
          retention-days: 30
          if-no-files-found: warn

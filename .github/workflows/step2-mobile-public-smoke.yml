name: STEP2 published mobile UX smoke (READ ONLY / HOLD)
on:
  push:
    branches: [step2-published-mobile-ux-smoke-20261011]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install real Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Public site mobile file selector to ZIP download
        run: python qa/step2_mobile_published_smoke.py
      - name: Archive screenshots and integrity report (READ ONLY)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STEP2_Mobile_Public_RealBrowser_Proof_HOLD
          path: step2_mobile_evidence/
          retention-days: 14
          if-no-files-found: warn

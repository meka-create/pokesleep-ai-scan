name: STEP2 verified importer and mobile QA (READ ONLY / CSV HOLD)
on:
  push:
    branches: [step2-qa-consolidated-review-20261011]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staged-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 7fc1ba49126a8e2e552ce7c9f58f062e388da456
          path: trusted_tools
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real browser prerequisites
        run: |
          python -m pip install playwright==1.56.0 Pillow==11.3.0 pyyaml==6.0.3
          python -m playwright install --with-deps chromium
      - name: Verify immutable kit, source syntax and baseline 84 tests
        run: |
          set -euo pipefail
          python qa/onepass_contract.py
          python -m py_compile kit-assets/*.py probe/*.py qa/*.py
          node --check app.js
          node --check zip-store.js
          node --check ui-extras.js
          node --check update-status.js
          node --check sw.js
          python -m unittest discover -s qa -p 'test_*.py' -v
          python -m unittest discover -s trusted_tools/tests -p 'test_auto_watch.py' -v
          python -m unittest discover -s trusted_tools/tests -p 'test_upstream_sync.py' -v
          python -m unittest discover -s trusted_tools/tests -p 'test_import_compat_gate.py' -v
          python -m unittest discover -s trusted_tools/tests -p 'test_verified_auto_promotion.py' -v
      - name: Build real browser 10 30 100 172 package regression
        run: python qa/prompt_browser_e2e.py
      - name: Generate synthetic coverage with no user images
        run: python qa/step2_build_synthetic_vectors.py
      - name: Verify public mobile viewport and ZIP download
        run: python qa/step2_mobile_published_smoke.py
      - name: Save proof (never publish CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STEP2_QA_Consolidation_Evidence_HOLD
          path: |
            qa/BROWSER_ZIP_RESULTS.json
            step2_evidence/fixtures/FIXTURE_PLAN.json
            step2_mobile_evidence/MOBILE_SMOKE_RESULT.json
          retention-days: 30
          if-no-files-found: warn
